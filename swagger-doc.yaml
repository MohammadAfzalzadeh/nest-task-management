openapi: 3.0.0
paths:
  /auth/signUp:
    post:
      operationId: AuthController_signUp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpDto'
      responses:
        '201':
          description: ''
      tags:
        - Auth
  /auth/logIn:
    post:
      operationId: AuthController_logIn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInDto'
      responses:
        '201':
          description: ''
      tags:
        - Auth
  /auth/profile:
    get:
      operationId: AuthController_getProfile
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Auth
    patch:
      operationId: AuthController_changeProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDto'
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/active:
    patch:
      operationId: AuthController_activeUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveUserDto'
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/users:
    get:
      operationId: AuthController_getAllUsers
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/role:
    patch:
      operationId: AuthController_changeRole
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRole'
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/image/{userId}:
    get:
      operationId: AuthController_getProfileImage
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/image:
    post:
      operationId: AuthController_updateProfileImage
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileImageDto'
      responses:
        '201':
          description: ''
      tags:
        - Auth
info:
  title: Project Management API
  description: API for managing projects
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignUpDto:
      type: object
      properties:
        username:
          type: string
          example: mohammad
          description: the unique username
        password:
          type: string
          example: 1qaz!QAZ
          description: strong password
        repeatPassword:
          type: string
          example: 1qaz!QAZ
          description: repeat the password
        email:
          type: string
          example: mohamamd@gmail.com
          description: a valid gmail
      required:
        - username
        - password
        - repeatPassword
        - email
    LogInDto:
      type: object
      properties:
        username:
          type: string
          example: mohammad
          description: username or email
        password:
          type: string
          example: 1qaz!QAZ
          description: password for user
      required:
        - username
        - password
    ActiveUserDto:
      type: object
      properties:
        userId:
          type: string
          example: 561badb8-b8e0-40b5-b607-28456830733b
          description: id for user need changes active or not active
        setActive:
          type: boolean
          example: true
          description: boolean that show is user set to active or not active
      required:
        - userId
        - setActive
    ChangeRole:
      type: object
      properties:
        userId:
          type: string
          example: 561badb8-b8e0-40b5-b607-28456830733b
          description: id for user need changes active or not active
        role:
          type: string
          example: admin
          enum:
            - user
            - admin
          description: Role to assign to the user
      required:
        - userId
        - role
    ProfileDto:
      type: object
      properties:
        username:
          type: string
          example: mohammad
          description: username
        firstName:
          type: string
          example: mohammad
          description: first name
        lastName:
          type: string
          example: afzal
          description: last name
        email:
          type: string
          example: mohammad@gmail.com
          description: email
        job:
          type: string
          example: data engineer
          description: job
        bio:
          type: string
          example: bio...
          description: bio
        birthday:
          format: date-time
          type: string
          example: '2001-10-13'
          description: birthday
    ProfileImageDto:
      type: object
      properties:
        profileImage:
          type: string
          description: image for this profile
          format: binary
      required:
        - profileImage
